<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body { width: 300px; margin: 0; padding: 14px 16px 16px;
        font-family: "Noto Sans KR","Roboto",Arial,sans-serif; background: #0f0f0f; color: #f1f1f1; }
      h1 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
      h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: #3ea6ff; }
      .row { display: flex; align-items: center; justify-content: space-between;
        padding: 9px 0; border-top: 1px solid #272727; }
      .row:first-of-type { border-top: none; }
      label { font-size: 13px; }
      select { background: #272727; color: #f1f1f1; border: 1px solid #3f3f3f;
        border-radius: 8px; padding: 5px 8px; font-size: 13px; }
      .switch { position: relative; width: 40px; height: 22px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider { position: absolute; inset: 0; background: #555; border-radius: 22px;
        transition: 0.2s; cursor: pointer; }
      .slider::before { content: ""; position: absolute; width: 16px; height: 16px;
        left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
      input:checked + .slider { background: #3ea6ff; }
      input:checked + .slider::before { transform: translateX(18px); }
      .sec { margin-top: 14px; border-top: 1px solid #272727; padding-top: 12px; }
      .sec h2 { font-size: 12px; color: #aaa; margin: 0 0 8px; font-weight: 600; }
      .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
      .field label { font-size: 12px; color: #ccc; }
      .field input { background: #272727; color: #f1f1f1; border: 1px solid #3f3f3f;
        border-radius: 8px; padding: 7px 9px; font-size: 12.5px; }
      .field input:focus { border-color: #3ea6ff; outline: none; }
      .save { width: 100%; background: #3ea6ff; color: #0f0f0f; border: none;
        border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 700; cursor: pointer; }
      .save:hover { background: #65b8ff; }
      .status { font-size: 11.5px; margin-top: 8px; min-height: 14px; color: #aaa; }
      .status.ok { color: #2faf6a; } .status.err { color: #e5484d; }
      .hint { font-size: 11px; color: #aaa; margin-top: 12px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span> YouTube 번역 &amp; 스크립트</h1>
    <div class="row"><label for="enabled">확장 사용</label>
      <div class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></div></div>
    <div class="row"><label for="target">번역 언어</label>
      <select id="target">
        <option value="ko">한국어</option><option value="en">English</option>
        <option value="ja">日本語</option><option value="zh-Hans">中文(简体)</option>
        <option value="zh-Hant">中文(繁體)</option><option value="es">Español</option>
        <option value="fr">Français</option><option value="de">Deutsch</option>
        <option value="vi">Tiếng Việt</option><option value="id">Bahasa Indonesia</option>
        <option value="ru">Русский</option>
      </select></div>
    <div class="row"><label for="overlay">영상 위 자막</label>
      <div class="switch"><input type="checkbox" id="overlay" /><span class="slider"></span></div></div>
    <div class="row"><label for="showOriginal">자막에 원문 함께 표시</label>
      <div class="switch"><input type="checkbox" id="showOriginal" /><span class="slider"></span></div></div>
    <div class="row"><label for="panel">스크립트 패널</label>
      <div class="switch"><input type="checkbox" id="panel" /><span class="slider"></span></div></div>

    <div class="sec">
      <h2>🧠 두뇌 저장 (RAG · 학습노트)</h2>
      <div class="field">
        <label for="serverUrl">대시보드 서버 주소</label>
        <input type="text" id="serverUrl" placeholder="http://34.50.23.221:8082" />
      </div>
      <div class="field">
        <label for="token">DASHBOARD_TOKEN</label>
        <input type="password" id="token" placeholder=".env 의 DASHBOARD_TOKEN" />
      </div>
      <button class="save" id="saveServer">저장 &amp; 권한 허용</button>
      <div class="status" id="status"></div>
    </div>

    <div class="hint">설정을 바꾸면 열려 있는 유튜브 탭에 바로 적용됩니다.<br />
      자막(또는 자동 생성 자막)이 있는 영상에서 동작합니다.<br />
      저장 버튼은 영상 옆 스크립트 패널의 🧠 RAG · 📒 노트 입니다.</div>
    <script src="popup.js"></script>
  </body>
</html>
