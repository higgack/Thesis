services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local-api"]
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - tg-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped
    mem_limit: 1500m
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Mirrors a source channel (LISTEN_CHANNEL env) to the bot DM in
  # real time. Runs as its own container so bot redeploys don't
  # interrupt the listener — and Docker auto-restarts it if Telethon
  # disconnects.
  forward-listener:
    build: .
    env_file: .env
    command: ["python", "-m", "src.scripts.forward_listener"]
    volumes:
      - ./data:/app/data
    depends_on:
      - bot
    restart: unless-stopped
    mem_limit: 400m
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Read-only browser for the permanent Q&A archive. Owner-token gated
  # via DASHBOARD_TOKEN. Runs as its own container so bot redeploys
  # don't interrupt browsing.
  dashboard:
    build: .
    env_file: .env
    command: ["python", "-m", "src.dashboard.app"]
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      - bot
    restart: unless-stopped
    mem_limit: 250m
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  tg-bot-api-data:
