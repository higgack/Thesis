services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-bot-api-data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build: .
    env_file: .env
    environment:
      TELEGRAM_BASE_URL: http://telegram-bot-api:8081/bot
    volumes:
      - ./data:/app/data
      - tg-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - telegram-bot-api

volumes:
  tg-bot-api-data:
