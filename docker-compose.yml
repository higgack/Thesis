services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local-api"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - tg-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  tg-bot-api-data:
