services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local-api"]
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    env_file: .env
    # HF_HOME inside /app/data so the BGE-reranker download (~380MB)
    # persists across container rebuilds via the bind mount.
    environment:
      HF_HOME: /app/data/hf_cache
    volumes:
      - ./data:/app/data
      - tg-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped
    # Bumped after VM upgrade e2-small (2GB) → e2-medium (4GB). 2.5GB
    # gives the bot enough headroom for BM25 cache + BGE-reranker
    # + ingest bursts without OOM-killing again.
    mem_limit: 2500m
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Mirrors a source channel (LISTEN_CHANNEL env) to the bot DM in
  # real time. Runs as its own container so bot redeploys don't
  # interrupt the listener — and Docker auto-restarts it if Telethon
  # disconnects.
  # Gated behind the 'forward' profile so the default
  # `docker compose up -d` (which auto_pull uses) does NOT start it.
  # The bot was paying ~₩2-5k/day to summarise mirrored content that
  # the user no longer wants. Re-enable with:
  #   COMPOSE_PROFILES=forward docker compose up -d forward-listener
  forward-listener:
    build: .
    profiles: ["forward"]
    env_file: .env
    command: ["python", "-m", "src.scripts.forward_listener"]
    volumes:
      - ./data:/app/data
    depends_on:
      - bot
    restart: unless-stopped
    mem_limit: 400m
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Static-file dashboard with a one-tap delete endpoint. Pure-stdlib
  # http.server subclass; only DASHBOARD_TOKEN-scoped DELETE writes
  # back to qna.db. Same image as bot to share deps, but the entry
  # point is server.py instead of bot.py. Replaces the host-side
  # systemd unit so containers + dashboard share the same lifecycle
  # and auto-deploy.
  dashboard:
    build: .
    env_file: .env
    command: ["python", "-m", "src.dashboard.server"]
    ports:
      - "8082:8082"
    volumes:
      - ./data:/app/data
    depends_on:
      - bot
    restart: unless-stopped
    mem_limit: 200m
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  tg-bot-api-data:
