services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["local-api"]
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - tg-bot-api-data:/var/lib/telegram-bot-api
    restart: unless-stopped
    mem_limit: 1500m
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Mirrors a source channel (LISTEN_CHANNEL env) to the bot DM in
  # real time. Runs as its own container so bot redeploys don't
  # interrupt the listener — and Docker auto-restarts it if Telethon
  # disconnects.
  forward-listener:
    build: .
    env_file: .env
    command: ["python", "-m", "src.scripts.forward_listener"]
    volumes:
      - ./data:/app/data
    depends_on:
      - bot
    restart: unless-stopped
    mem_limit: 400m
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # The dashboard used to live here as a containerized FastAPI app on
  # ports 8080/8090/80/8081/8082 — every variant tripped on either
  # KR-ISP outbound rules, Chrome HTTPS-First, or duplicate name
  # squatting. The user's other working dashboards are bare
  # `python3 -m http.server` on the host hitting static files, so
  # we now mirror that pattern: src/dashboard/regenerate.py rewrites
  # the static HTML under data/dashboard/<TOKEN>/ on every Q&A, and
  # the user runs http.server directly on the host (systemd unit or
  # @reboot cron) on whatever port their network already trusts.

volumes:
  tg-bot-api-data:
