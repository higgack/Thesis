[project]
name = "substacknoah-secondbrain"
version = "0.1.0"
description = "Personal Telegram RAG knowledge base"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[ext]>=21.6",
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    "chromadb>=0.5.20",
    "trafilatura>=1.12.0",
    "pypdf>=5.0.0",
    "youtube-transcript-api>=0.6.2",
    "notion-client>=2.2.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tiktoken>=0.8.0",
    "rank-bm25>=0.2.2",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
