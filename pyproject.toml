[project]
name = "substacknoah-secondbrain"
version = "0.1.0"
description = "Personal Telegram RAG knowledge base"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[ext]>=21.6",
    "google-genai>=1.0.0",
    "chromadb>=0.5.20",
    "trafilatura>=1.12.0",
    "pypdf>=5.0.0",
    "pymupdf>=1.24.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "youtube-transcript-api>=0.6.2",
    # yt-dlp from git master — PyPI release cadence (≈ every 1–2
    # months) lags YouTube's anti-bot changes; master usually carries
    # bypass patches within days of a YouTube break. Trade-off:
    # master can be momentarily broken, each rebuild may grab a
    # different commit. Roll back to a tagged version (>= …) if a
    # build starts failing because master is bad.
    "yt-dlp @ git+https://github.com/yt-dlp/yt-dlp.git@master",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tiktoken>=0.8.0",
    "rank-bm25>=0.2.2",
    "tenacity>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "telethon>=1.36.0",
    "sentence-transformers>=3.0",
    "psutil>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
